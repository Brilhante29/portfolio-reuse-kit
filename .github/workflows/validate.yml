name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Validate JSON schema
        run: python -m json.tool harness/result.schema.json > /dev/null
      - name: Validate Python syntax
        run: python -m py_compile harness/bench.py harness/compare_results.py tools/generate-publication-benchmark.py tests/test_generate_publication_benchmark.py
      - name: Test publication benchmark producer
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Test Node dependency advisory harness
        run: node --test --test-isolation=none harness/node/npm-advisory-audit.test.mjs
      - name: Validate kit structure
        shell: pwsh
        run: ./tools/validate-kit.ps1
      - name: Smoke benchmark harness
        run: python harness/bench.py --project kit-ci --metric latency_ms --unit ms --repeat 1 --warmup 0 --out-dir /tmp/kit-results python --version
